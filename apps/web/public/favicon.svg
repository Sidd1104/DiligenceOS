<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glass-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Shield Base Shape -->
  <path
    d="M50 8 L88 23 C88 58 68 82 50 92 C32 82 12 58 12 23 Z"
    fill="url(#shield-bg)"
    stroke="url(#shield-gradient)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Inner Shield Accent -->
  <path
    d="M50 14 L82 27 C82 55 65 76 50 85"
    stroke="url(#shield-gradient)"
    stroke-width="1.5"
    stroke-opacity="0.35"
    fill="none"
  />

  <!-- Magnifying Glass Lens Outer Ring -->
  <circle
    cx="50"
    cy="44"
    r="20"
    fill="url(#glass-lens)"
    stroke="url(#shield-gradient)"
    stroke-width="5.5"
  />

  <!-- Lens Glare -->
  <path
    d="M40 32 A 14 14 0 0 1 58 32"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />

  <!-- Handle -->
  <path
    d="M36 58 L24 70 C22 72 22 75 24 77 L25 78 C27 80 30 80 32 78 L44 66"
    fill="url(#shield-gradient)"
    stroke="url(#shield-gradient)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <line x1="28" y1="74" x2="31" y2="71" stroke="#0b0f19" stroke-width="2.5" stroke-linecap="round" />
</svg>
